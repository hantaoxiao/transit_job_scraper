name: Scrape and deploy transit jobs

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Weekdays run every 2 hours from 7 AM-7 PM Eastern during daylight saving time.
    - cron: "17 11-23/2 * * 1-5"
    # Weekends run every 6 hours Eastern during daylight saving time.
    - cron: "17 4,10,16,22 * * 0,6"

concurrency:
  group: transit-job-refresh
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 75

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SCRAPER_WORKERS: "6"
      SCRAPER_DETAIL_CACHE: "0"
      GOVJOBS_AGENCY_WORKERS: "1"
      GOVJOBS_RETRIES: "3"
      GOVJOBS_CONNECT_TIMEOUT: "12"
      GOVJOBS_REQUEST_DELAY: "0.4"
      GOVJOBS_AGENCY_DELAY: "0.8"
      SCRAPER_MIN_TOTAL_JOBS: "100"
      SCRAPER_MIN_TOTAL_RATIO: "0.50"
      SCRAPER_ZERO_AGENCY_CACHE_MIN: "10"
      SCRAPER_FAILED_AGENCY_CACHE_MIN: "1"
      SCRAPER_PARTIAL_CACHE_AGENCIES: "MTA,PATH,Utah Transit Authority"
      SCRAPER_AGENCY_MIN_TOTAL_RATIO: "0.75"
      SCRAPER_PRESERVE_AGENCY_CACHE_ON_ZERO: "1"
      MTA_SCRAPER_TIMEOUT: "900"
      MTA_CAREERS_PER_PAGE: "100"
      MTA_CAREERS_MAX_PAGES: "20"
      MTA_CAREERS_DELAY: "0.25"
      MTA_DETAIL_WORKERS: "12"
      MTA_REQUEST_TIMEOUT: "30"
      MTA_DETAIL_DELAY: "0"
      WORKDAY_DETAIL_WORKERS: "8"
      UKG_DETAIL_WORKERS: "8"
      JOBS2WEB_DETAIL_WORKERS: "8"
      SUCCESSFACTORS_DETAIL_WORKERS: "8"
      ORACLE_DETAIL_WORKERS: "8"
      SALESFORCE_DETAIL_WORKERS: "6"
      JINA_DETAIL_WORKERS: "8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install GNU tar on macOS
        if: runner.os == 'macOS'
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            if [ -x /opt/homebrew/bin/brew ]; then
              eval "$(/opt/homebrew/bin/brew shellenv)"
            elif [ -x /usr/local/bin/brew ]; then
              eval "$(/usr/local/bin/brew shellenv)"
            fi
          fi
          if command -v gtar >/dev/null 2>&1; then
            gtar --version
            exit 0
          fi
          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew is required on macOS self-hosted runners so actions/upload-pages-artifact can use gtar." >&2
            echo "Install Homebrew or run: brew install gnu-tar" >&2
            exit 1
          fi
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
          gtar --version

      - name: Install browser dependencies on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install browser dependencies on non-Linux
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Run regression tests
        run: python -m unittest discover -s tests

      - name: Scrape jobs and build static data
        run: python main.py

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-jobs-csv
          path: output/transit_jobs.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
