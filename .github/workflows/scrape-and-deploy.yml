name: Scrape and deploy transit jobs

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. This is 7 AM-7 PM Eastern during daylight saving time.
    - cron: "17 11-23/2 * * 1-5"

concurrency:
  group: transit-job-refresh
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      PYTHONUNBUFFERED: "1"
      SCRAPER_WORKERS: "6"
      GOVJOBS_AGENCY_WORKERS: "2"
      GOVJOBS_DETAIL_WORKERS: "2"
      GOVJOBS_RETRIES: "3"
      MTA_JINA_LIST_WORKERS: "1"
      MTA_JINA_DETAIL_WORKERS: "4"
      MTA_JINA_RETRIES: "3"
      WORKDAY_DETAIL_WORKERS: "8"
      UKG_DETAIL_WORKERS: "8"
      JOBS2WEB_DETAIL_WORKERS: "8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install browser dependencies
        run: python -m playwright install --with-deps chromium

      - name: Restore previous scrape cache
        uses: actions/cache/restore@v4
        with:
          path: output/transit_jobs.csv
          key: transit-jobs-output-${{ github.run_id }}
          restore-keys: |
            transit-jobs-output-

      - name: Scrape jobs and build static data
        run: python main.py

      - name: Save scrape cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/transit_jobs.csv
          key: transit-jobs-output-${{ github.run_id }}

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transit-jobs-csv
          path: output/transit_jobs.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
